<!--
  The mark index.html links to. Kept as geometry rather than text so it renders
  identically wherever there is no Inter to fall back on, and self-contained (a
  filled tile plus its glyph) because favicons sit on browser chrome in both
  themes. The blue is the primary token from src/index.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#338de4" />
  <g fill="#0b1120">
    <rect x="9" y="8" width="3.6" height="16" rx="1" />
    <rect x="19.4" y="8" width="3.6" height="16" rx="1" />
    <path d="M12.6 8h3.4l3.4 16h-3.4z" />
  </g>
</svg>