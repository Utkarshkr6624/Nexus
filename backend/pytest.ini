[pytest]
# Canonical pytest configuration. pytest.ini takes precedence over the
# [tool.pytest.ini_options] table in pyproject.toml, which holds ruff config.
minversion = 8.0
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts = -ra --strict-markers --strict-config
# pytest prepends ini filters, so the LAST match wins. The blanket ignore has to
# come first for the app.* rule to still be able to escalate anything.
filterwarnings =
    ignore::DeprecationWarning
    error::DeprecationWarning:app.*
markers =
    integration: requires a live PostgreSQL instance
    # Phase 11 is the first suite that cannot be run by everyone who clones the
    # repository: it needs the trained Phase 10 checkpoint under
    # backend/ml/artifacts/, which is gitignored and therefore usually absent,
    # and torch, which is a large optional-ish install. The Phase 10 suite was
    # deliberately 100% offline and torch-free, so these tests would otherwise
    # be the first in the project to hard-fail on a clean checkout. This marker
    # follows the same philosophy as `integration`: name the environmental
    # precondition, and have the tests skip cleanly — with a reason — when it
    # does not hold, rather than silently not covering the code or crashing.
    ml_model: requires the trained Phase 10 checkpoint on disk and torch installed; skipped when either is absent
